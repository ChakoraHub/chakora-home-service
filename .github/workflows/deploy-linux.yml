name: Deploy Home Service

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.APP_PATH }}
            git pull origin main
            if [ -d "home-venv" ] && ! ./home-venv/bin/python --version >/dev/null 2>&1; then
              rm -rf home-venv
            fi
            if [ ! -d "home-venv" ]; then
              python3 -m venv home-venv || python -m venv home-venv
            fi
            if [ -x "./home-venv/bin/pip" ]; then
              ./home-venv/bin/pip install --upgrade pip setuptools wheel || true
              ./home-venv/bin/pip install -r requirements.txt
            else
              pip install -r requirements.txt || true
            fi
            SERVICE_NAME="${{ secrets.PM2_SERVICE_NAME }}"
            if [ -z "$SERVICE_NAME" ]; then
              SERVICE_NAME="home-service"
            fi
            if [ -x "./home-venv/bin/uvicorn" ]; then
              pm2 restart "$SERVICE_NAME" || pm2 start "./home-venv/bin/uvicorn home_service:app --host 0.0.0.0 --port 5001" --name "$SERVICE_NAME"
            else
              pm2 restart "$SERVICE_NAME" || pm2 start "uvicorn home_service:app --host 0.0.0.0 --port 5001" --name "$SERVICE_NAME"
            fi
            pm2 save
