name: Deploy Home Service

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.APP_PATH }}
            git pull origin main
            source home-venv/bin/activate || source venv/bin/activate || true
            test -f requirements.txt && pip install -r requirements.txt || true
            pm2 restart home-service || pm2 restart ${{ secrets.PM2_SERVICE_NAME }} || pm2 start "uvicorn home_service:app --host 0.0.0.0 --port 5001" --name home-service
            pm2 save
